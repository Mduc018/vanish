name: Build VanishCam EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Download missing AI models
        run: |
          python -c "import os, urllib.request; os.makedirs('models', exist_ok=True); urllib.request.urlretrieve('https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task', 'models/gesture_recognizer.task'); urllib.request.urlretrieve('https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite', 'models/selfie_segmenter_landscape.tflite')"
      - name: Build EXE
        run: |
          pyinstaller VanishCam.spec
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanishCam-Windows
          path: dist/
